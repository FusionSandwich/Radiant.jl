name: HTS add-on tests

on:
  push:
    branches:
      - 'codex/**'
  workflow_dispatch:

concurrency:
  group: hts-addon-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} extraction-ready add-on
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.6.7'
          - '1.10.12'
    steps:
      - uses: actions/checkout@v7
      - name: Validate Python adapters parse
        run: |
          python -m py_compile scripts/geometry/export_dagmc_facets.py
          python -m py_compile scripts/data/download_zenodo_record.py
          python -m py_compile scripts/references/create_physical_reference_fixture.py
          python -m py_compile scripts/references/build_physical_reference_bundle.py
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate and precompile
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Run existing HTS add-on regression tests
        run: julia --startup-file=no --project=. test/hts_addon_tests.jl
      - name: Run production-foundation regression tests
        run: julia --startup-file=no --project=. test/hts_production_foundations_tests.jl
      - name: Run faceted local-domain tests
        run: julia --startup-file=no --project=. test/hts_faceted_local_domain_tests.jl
      - name: Run analytic curvature and grazing tests
        run: julia --startup-file=no --project=. test/hts_curvature_math_tests.jl
      - name: Run three-level curvature convergence tests
        run: julia --startup-file=no --project=. test/hts_curvature_convergence_tests.jl
      - name: Run evaluated Gd cascade tests
        run: julia --startup-file=no --project=. test/hts_gd_evaluated_tests.jl
      - name: Run neutronics heating and Gd self-shielding tests
        run: julia --startup-file=no --project=. test/hts_neutronics_heating_tests.jl
      - name: Run response-preserving group condensation tests
        run: julia --startup-file=no --project=. test/hts_group_condensation_tests.jl
      - name: Run HTS material response-table tests
        run: julia --startup-file=no --project=. test/hts_response_table_completion_tests.jl
      - name: Run physical-reference bundle tests
        run: julia --startup-file=no --project=. test/hts_physical_reference_bundle_tests.jl
      - name: Record branch-only qualification
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/hts-addon
          {
            echo 'schema = "radiant.hts_addon_test_receipt/v9"'
            echo 'branch_policy = "branch-only-no-pr"'
            echo 'future_package = "RadiantHTS.jl"'
            echo 'julia_version = "${{ matrix.julia-version }}"'
            echo 'commit = "${{ github.sha }}"'
            echo 'workflow_status = "${{ job.status }}"'
            echo 'spatial_field_operator_tested = true'
            echo 'faceted_geometry_tested = true'
            echo 'faceted_local_domain_tested = true'
            echo 'analytic_curvature_heating_tested = true'
            echo 'curvature_convergence_contract_tested = true'
            echo 'complete_evaluated_gd_adapter_tested = true'
            echo 'gdbco_self_shielding_screen_tested = true'
            echo 'heating_ownership_ledger_tested = true'
            echo 'response_preserving_group_condensation_tested = true'
            echo 'material_registry_tested = true'
            echo 'atomistic_table_pipeline_tested = true'
            echo 'material_response_completion_tested = true'
            echo 'physical_reference_bundle_tested = true'
            echo 'closed_coupling_algorithm_tested = true'
            echo 'physical_openmc_replay_pass = false'
            echo 'physical_opensn_replay_pass = false'
            echo 'physical_curved_transport_pass = false'
            echo 'evaluated_gd_physical_data_pass = false'
            echo 'ybco_gdbco_material_data_physical_pass = false'
          } > artifacts/hts-addon/receipt-julia-${{ matrix.julia-version }}.toml
      - name: Upload add-on qualification receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hts-addon-julia-${{ matrix.julia-version }}
          path: artifacts/hts-addon
          if-no-files-found: error
