name: Cross-language source replay

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: cross-language-replay-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  replay:
    name: Python h5py to Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        julia-version:
          - '1.6.7'
          - '1.10'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install fixture dependencies
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'h5py>=3.10,<4'
      - name: Create Python HDF5 source fixtures
        run: python scripts/adapters/create_cross_language_source_fixture.py artifacts/cross-language-fixtures
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
          arch: x64
      - uses: julia-actions/cache@v3
      - name: Instantiate Radiant
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'
      - name: Validate in Julia
        run: >-
          julia --project=. scripts/qualification/validate_cross_language_source_fixture.jl
          artifacts/cross-language-fixtures
          artifacts/cross-language-replay-julia-${{ matrix.julia-version }}.toml
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-language-source-replay-julia-${{ matrix.julia-version }}
          path: artifacts
          if-no-files-found: error
