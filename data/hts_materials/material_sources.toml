url = "https://trc.nist.gov/cryogenics/materials/G-10%20CR%20Fiberglass%20Epoxy/G10CRFiberglassEpoxy_rev.htm"
implemented = true
implementation = "default_material_response_registry"
validity_note = "Normal and warp directions are distinct and must not be averaged implicitly."

