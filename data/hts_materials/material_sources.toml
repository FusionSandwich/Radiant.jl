schema = "radiant.hts.material_sources/v1"
classification = "source-registry-not-physical-qualification"
future_package = "RadiantHTS.jl"

[policy]
no_silent_extrapolation = true
no_silent_ybco_to_gdbco_substitution = true
retain_material_state_hash = true
retain_oxygen_content = true
retain_field_orientation = true
retain_damage_state = true
retain_uncertainty = true

[[source]]
id = "NIST-CRYO-OFHC-CU"
material = "Cu"
properties = ["specific_heat", "thermal_conductivity"]
source_type = "official-evaluated-fit"
url = "https://trc.nist.gov/cryogenics/materials/OFHC%20Copper/OFHC_Copper_rev1.htm"
reference = "N. J. Simon, E. S. Drexler, and R. P. Reed, Properties of Copper and Copper Alloys at Cryogenic Temperatures, NIST Monograph 177 (1992)."
implemented = true
implementation = "default_material_response_registry"
validity_note = "Thermal-conductivity fit is purity/RRR dependent; tape copper must retain an RRR or irradiation-state identifier."

[[source]]
id = "NIST-CRYO-KAPTON"
material = "Kapton"
properties = ["specific_heat", "thermal_conductivity"]
source_type = "official-evaluated-fit"
url = "https://trc.nist.gov/cryogenics/materials/Polyimide%20Kapton/PolyimideKapton_rev.htm"
implemented = true
implementation = "default_material_response_registry"
validity_note = "Apply only within the NIST fit range and preserve film orientation/manufacturing metadata where available."

[[source]]
id = "NIST-CRYO-G10"
material = "G10"
properties = ["specific_heat", "normal_thermal_conductivity", "warp_thermal_conductivity"]
